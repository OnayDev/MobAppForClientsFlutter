name: flutter_client_oi
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  google_fonts: ^9.0.0
  http: ^1.6.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  # image_path: "/assets/logo/white-big.png"
  adaptive_icon_background: "#ffffff"
  # adaptive_icon_foreground: "/assets/logo/white-big.png"
  # adaptive_icon_foreground_inset: 16